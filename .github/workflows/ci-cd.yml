name: CI/CD - Projeto PIX

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test-and-lint:
    name: Testes Backend & Lint e Build Frontend
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
      MYSQL_PORT: '33306'
      MYSQL_USER: byebank_ci
      MYSQL_PASSWORD: byebank-ci-test
      MYSQL_ROOT_PASSWORD: byebank-ci-root
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Subir MySQL de teste
        run: docker compose up --wait --wait-timeout 120 mysql

      - name: Rodar testes do Backend em memória e MySQL
        working-directory: ./backend
        env:
          BYEBANK_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:33306/byebank_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          BYEBANK_TEST_MYSQL_USER: ${{ env.MYSQL_USER }}
          BYEBANK_TEST_MYSQL_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        run: ./mvnw test

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Instalar dependências e rodar Lint/Build no Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run build

  # 2. BUILD ÚNICO DAS IMAGENS DOCKER (Roda após merge na main ou Tag)
  build-and-push:
    name: Build Único de Imagens Docker
    needs: test-and-lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Definir Tag da Versão
        id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Build e Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest

  # 3. VALIDAÇÃO DE CONFIGURAÇÃO EM DEV (Todo push na main)
  deploy-dev:
    name: Validar configuração DEV
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar Compose com as imagens publicadas
        env:
          APP_ENV: dev
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          test -n "$IMAGE_TAG"
          BACKEND_IMAGE="$REGISTRY/$IMAGE_PREFIX-backend:$IMAGE_TAG" \
          FRONTEND_IMAGE="$REGISTRY/$IMAGE_PREFIX-frontend:$IMAGE_TAG" \
          docker compose config --quiet

  # 4. VALIDAÇÃO DE CONFIGURAÇÃO EM HOMOLOGAÇÃO (Tag v*)
  deploy-hom:
    name: Validar configuração de homologação
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar Compose com as imagens publicadas
        env:
          APP_ENV: hom
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          test -n "$IMAGE_TAG"
          BACKEND_IMAGE="$REGISTRY/$IMAGE_PREFIX-backend:$IMAGE_TAG" \
          FRONTEND_IMAGE="$REGISTRY/$IMAGE_PREFIX-frontend:$IMAGE_TAG" \
          docker compose config --quiet

  # 5. VALIDAÇÃO DE CONFIGURAÇÃO NO ENVIRONMENT PRODUCTION (Tag v*)
  deploy-prd:
    name: Validar configuração de produção
    needs: [build-and-push, deploy-hom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar Compose com as imagens publicadas
        env:
          APP_ENV: prd
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          test -n "$IMAGE_TAG"
          BACKEND_IMAGE="$REGISTRY/$IMAGE_PREFIX-backend:$IMAGE_TAG" \
          FRONTEND_IMAGE="$REGISTRY/$IMAGE_PREFIX-frontend:$IMAGE_TAG" \
          docker compose config --quiet
