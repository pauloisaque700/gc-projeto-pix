services:
  prometheus:
    image: prom/prometheus:latest
    container_name: pix-prometheus-${APP_ENV:-dev}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    networks:
      - pix-network

  grafana:
    image: grafana/grafana:latest
    container_name: pix-grafana-${APP_ENV:-dev}
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - pix-network

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: pix-mysql-${APP_ENV:-dev}
    environment:
      MYSQL_DATABASE: byebank_db
      MYSQL_USER: ${MYSQL_USER:-byebank}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-byebank123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}"
          --database="$${MYSQL_DATABASE}" --execute="SELECT 1 FROM log_login LIMIT 0"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pix-network

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: pix-phpmyadmin-${APP_ENV:-dev}
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pix-network

  backend:
    image: ${BACKEND_IMAGE:-pix-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pix-backend-${APP_ENV:-dev}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-mysql}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/byebank_db?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:-byebank}}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:-byebank123}}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pix-network

  frontend:
    image: ${FRONTEND_IMAGE:-pix-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8080}}
    container_name: pix-frontend-${APP_ENV:-dev}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - pix-network

volumes:
  mysql-data:
  grafana_data:

networks:
  pix-network:
    driver: bridge
