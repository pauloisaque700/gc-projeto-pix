services:
  backend:
    image: ${BACKEND_IMAGE:-pix-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pix-backend-${APP_ENV:-dev}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${APP_ENV:-dev}
    networks:
      - pix-network

  frontend:
    image: ${FRONTEND_IMAGE:-pix-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: pix-frontend-${APP_ENV:-dev}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - pix-network

networks:
  pix-network:
    driver: bridge
