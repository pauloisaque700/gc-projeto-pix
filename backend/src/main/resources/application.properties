spring.application.name=backend

# Porta explícita para o backend, usada pelo frontend em NEXT_PUBLIC_API_URL.
server.port=8080

# O datasource recebe SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
# O ambiente MySQL aplica o init.sql e controla o esquema.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
